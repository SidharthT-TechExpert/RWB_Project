user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 20M;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Security headers (non-CORS only — CORS is handled by Express)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # Proxy settings shared across all locations
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Redirect HTTP → HTTPS ──────────────────────────────
    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTP fallback on 8080 (before SSL cert exists) ────
    server {
        listen 8080;
        server_name api.qickbite.com _;

        # Pure proxy — CORS handled by Express
        location /api/ {
            proxy_pass http://api-gateway:3000;
            proxy_read_timeout 120s;
        }
        location /health {
            proxy_pass http://api-gateway:3000;
            access_log off;
        }
        location / {
            return 404;
        }
    }

    # ── Main HTTPS server ─────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.qickbite.com;

        ssl_certificate /etc/letsencrypt/live/api.qickbite.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.qickbite.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Pure proxy — CORS headers set by Express api-gateway only
        # This prevents duplicate Access-Control-Allow-Origin headers

        # Auth routes — stricter rate limit
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://api-gateway:3000;
            proxy_read_timeout 60s;
        }

        # All other API routes
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://api-gateway:3000;
            proxy_read_timeout 120s;
        }

        # Health check
        location /health {
            proxy_pass http://api-gateway:3000;
            access_log off;
        }

        location ~ /\. { deny all; }
    }
}
