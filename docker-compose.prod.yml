# Production docker-compose — uses pre-built images from GitHub Container Registry
# Deployed to AWS EC2 via GitHub Actions
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  # ─── Infrastructure ───────────────────────────────────────
  mongodb:
    image: mongo:8.0
    container_name: quickbite-mongodb
    restart: always
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-quickbite}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    networks:
      - quickbite-network
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_USER:-quickbite}", "-p", "${MONGO_PASSWORD}", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: quickbite-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - quickbite-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: quickbite-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-quickbite}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - quickbite-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Nginx reverse proxy ──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: quickbite-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - api-gateway
      - web
    networks:
      - quickbite-network

  # ─── Microservices ────────────────────────────────────────
  api-gateway:
    image: ${IMAGE_PREFIX:-ghcr.io/your-org/quickbite}-api-gateway:${IMAGE_TAG:-latest}
    container_name: quickbite-api-gateway
    restart: always
    env_file: .env.docker
    environment:
      API_GATEWAY_PORT: 3000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - quickbite-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  auth-service:
    image: ${IMAGE_PREFIX:-ghcr.io/your-org/quickbite}-auth-service:${IMAGE_TAG:-latest}
    container_name: quickbite-auth-service
    restart: always
    env_file: .env.docker
    environment:
      AUTH_SERVICE_PORT: 3001
      MONGODB_URI_AUTH: mongodb://${MONGO_USER:-quickbite}:${MONGO_PASSWORD}@mongodb:27017/quickbite_auth?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - quickbite-network

  user-service:
    image: ${IMAGE_PREFIX:-ghcr.io/your-org/quickbite}-user-service:${IMAGE_TAG:-latest}
    container_name: quickbite-user-service
    restart: always
    env_file: .env.docker
    environment:
      USER_SERVICE_PORT: 3002
      MONGODB_URI_USER: mongodb://${MONGO_USER:-quickbite}:${MONGO_PASSWORD}@mongodb:27017/quickbite_user?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - quickbite-network

  restaurant-service:
    image: ${IMAGE_PREFIX:-ghcr.io/your-org/quickbite}-restaurant-service:${IMAGE_TAG:-latest}
    container_name: quickbite-restaurant-service
    restart: always
    env_file: .env.docker
    environment:
      RESTAURANT_SERVICE_PORT: 3003
      MONGODB_URI_RESTAURANT: mongodb://${MONGO_USER:-quickbite}:${MONGO_PASSWORD}@mongodb:27017/quickbite_restaurant?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - quickbite-network

  food-service:
    image: ${IMAGE_PREFIX:-ghcr.io/your-org/quickbite}-food-service:${IMAGE_TAG:-latest}
    container_name: quickbite-food-service
    restart: always
    env_file: .env.docker
    environment:
      FOOD_SERVICE_PORT: 3004
      MONGODB_URI_FOOD: mongodb://${MONGO_USER:-quickbite}:${MONGO_PASSWORD}@mongodb:27017/quickbite_food?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - quickbite-network

  booking-service:
    image: ${IMAGE_PREFIX:-ghcr.io/your-org/quickbite}-booking-service:${IMAGE_TAG:-latest}
    container_name: quickbite-booking-service
    restart: always
    env_file: .env.docker
    environment:
      BOOKING_SERVICE_PORT: 3005
      MONGODB_URI_BOOKING: mongodb://${MONGO_USER:-quickbite}:${MONGO_PASSWORD}@mongodb:27017/quickbite_booking?authSource=admin
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-quickbite}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - quickbite-network

  order-service:
    image: ${IMAGE_PREFIX:-ghcr.io/your-org/quickbite}-order-service:${IMAGE_TAG:-latest}
    container_name: quickbite-order-service
    restart: always
    env_file: .env.docker
    environment:
      ORDER_SERVICE_PORT: 3006
      MONGODB_URI_ORDER: mongodb://${MONGO_USER:-quickbite}:${MONGO_PASSWORD}@mongodb:27017/quickbite_order?authSource=admin
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-quickbite}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - quickbite-network

  payment-service:
    image: ${IMAGE_PREFIX:-ghcr.io/your-org/quickbite}-payment-service:${IMAGE_TAG:-latest}
    container_name: quickbite-payment-service
    restart: always
    env_file: .env.docker
    environment:
      PAYMENT_SERVICE_PORT: 3007
      MONGODB_URI_PAYMENT: mongodb://${MONGO_USER:-quickbite}:${MONGO_PASSWORD}@mongodb:27017/quickbite_payment?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - quickbite-network

  review-service:
    image: ${IMAGE_PREFIX:-ghcr.io/your-org/quickbite}-review-service:${IMAGE_TAG:-latest}
    container_name: quickbite-review-service
    restart: always
    env_file: .env.docker
    environment:
      REVIEW_SERVICE_PORT: 3008
      MONGODB_URI_REVIEW: mongodb://${MONGO_USER:-quickbite}:${MONGO_PASSWORD}@mongodb:27017/quickbite_review?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - quickbite-network

  search-service:
    image: ${IMAGE_PREFIX:-ghcr.io/your-org/quickbite}-search-service:${IMAGE_TAG:-latest}
    container_name: quickbite-search-service
    restart: always
    env_file: .env.docker
    environment:
      SEARCH_SERVICE_PORT: 3009
      MONGODB_URI_SEARCH: mongodb://${MONGO_USER:-quickbite}:${MONGO_PASSWORD}@mongodb:27017/quickbite_search?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - quickbite-network

  location-service:
    image: ${IMAGE_PREFIX:-ghcr.io/your-org/quickbite}-location-service:${IMAGE_TAG:-latest}
    container_name: quickbite-location-service
    restart: always
    env_file: .env.docker
    environment:
      LOCATION_SERVICE_PORT: 3010
    networks:
      - quickbite-network

  notification-service:
    image: ${IMAGE_PREFIX:-ghcr.io/your-org/quickbite}-notification-service:${IMAGE_TAG:-latest}
    container_name: quickbite-notification-service
    restart: always
    env_file: .env.docker
    environment:
      NOTIFICATION_SERVICE_PORT: 3011
      MONGODB_URI_NOTIFICATION: mongodb://${MONGO_USER:-quickbite}:${MONGO_PASSWORD}@mongodb:27017/quickbite_notification?authSource=admin
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-quickbite}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - quickbite-network

  admin-service:
    image: ${IMAGE_PREFIX:-ghcr.io/your-org/quickbite}-admin-service:${IMAGE_TAG:-latest}
    container_name: quickbite-admin-service
    restart: always
    env_file: .env.docker
    environment:
      ADMIN_SERVICE_PORT: 3012
      MONGODB_URI_ADMIN: mongodb://${MONGO_USER:-quickbite}:${MONGO_PASSWORD}@mongodb:27017/quickbite_admin?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - quickbite-network

  analytics-service:
    image: ${IMAGE_PREFIX:-ghcr.io/your-org/quickbite}-analytics-service:${IMAGE_TAG:-latest}
    container_name: quickbite-analytics-service
    restart: always
    env_file: .env.docker
    environment:
      ANALYTICS_SERVICE_PORT: 3013
      MONGODB_URI_ANALYTICS: mongodb://${MONGO_USER:-quickbite}:${MONGO_PASSWORD}@mongodb:27017/quickbite_analytics?authSource=admin
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-quickbite}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - quickbite-network

  # ─── Web App ─────────────────────────────────────────────
  web:
    image: ${IMAGE_PREFIX:-ghcr.io/your-org/quickbite}-web:${IMAGE_TAG:-latest}
    container_name: quickbite-web
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${DOMAIN:-yourdomain.com}/api/v1
    networks:
      - quickbite-network

volumes:
  mongodb_data:
  redis_data:
  rabbitmq_data:
  certbot_data:
  certbot_certs:

networks:
  quickbite-network:
    driver: bridge
