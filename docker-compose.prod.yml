# Production — uses pre-built images from GitHub Container Registry
# MongoDB Atlas + Upstash Redis (external managed services)
# Web (Next.js) + API (Express) behind nginx on one EC2

services:
  # ─── Nginx reverse proxy ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: quickbite-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_data:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - web
    networks:
      - quickbite-network

  # ─── Web (Next.js) ────────────────────────────────────────────
  web:
    image: ${IMAGE_PREFIX:-ghcr.io/qickbite/quickbite}-web:${IMAGE_TAG:-latest}
    container_name: quickbite-web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3006
      HOSTNAME: 0.0.0.0
    networks:
      - quickbite-network

  # ─── API (monolith) ───────────────────────────────────────────
  api:
    image: ${IMAGE_PREFIX:-ghcr.io/qickbite/quickbite}-api:${IMAGE_TAG:-latest}
    container_name: quickbite-api
    restart: always
    env_file: .env.docker
    environment:
      PORT: 3000
      NODE_ENV: production
    networks:
      - quickbite-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  certbot_data:

networks:
  quickbite-network:
    driver: bridge
