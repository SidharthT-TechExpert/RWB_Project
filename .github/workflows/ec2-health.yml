name: EC2 Health Check

on:
  workflow_dispatch: # Manual trigger from GitHub Actions tab

jobs:
  health:
    name: EC2 System & Docker Health
    runs-on: ubuntu-latest
    steps:
      - name: Check EC2 health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "════════════════════════════════════════"
            echo "        EC2 SYSTEM HEALTH REPORT"
            echo "════════════════════════════════════════"

            echo ""
            echo "── Uptime ───────────────────────────────"
            uptime

            echo ""
            echo "── CPU & Memory ─────────────────────────"
            free -h

            echo ""
            echo "── CPU Usage (top 5 processes) ──────────"
            ps aux --sort=-%cpu | head -6

            echo ""
            echo "── Disk Usage ───────────────────────────"
            df -h /

            echo ""
            echo "── Docker Disk Usage ────────────────────"
            docker system df -v 2>/dev/null | head -60

            echo ""
            echo "── Running Containers (CPU/MEM) ─────────"
            docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.NetIO}}\t{{.BlockIO}}"

            echo ""
            echo "── Container Status ─────────────────────"
            cd ~/quickbite
            docker compose -f docker-compose.prod.yml ps

            echo ""
            echo "── Docker Images (size) ─────────────────"
            docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}\t{{.CreatedSince}}" | sort -k3 -rh | head -20

            echo ""
            echo "── Recent Container Logs (errors only) ──"
            for svc in api-gateway auth-service; do
              echo "--- $svc ---"
              docker logs quickbite-$svc --since 1h 2>&1 | grep -i "error\|fatal\|exception" | tail -5 || echo "(no errors)"
            done

            echo ""
            echo "════════════════════════════════════════"
            echo "             END OF REPORT"
            echo "════════════════════════════════════════"
