name: Debug EC2 Containers

on:
  workflow_dispatch:

jobs:
  debug:
    name: SSH into EC2 and show container state
    runs-on: ubuntu-latest
    steps:
      - name: Check container status and logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/quickbite

            echo "════════════════════════════════════════"
            echo "  CONTAINER STATUS"
            echo "════════════════════════════════════════"
            docker compose -f docker-compose.prod.yml ps

            echo ""
            echo "════════════════════════════════════════"
            echo "  AUTH-SERVICE LOGS (last 50 lines)"
            echo "════════════════════════════════════════"
            docker logs quickbite-auth-service --tail 50 2>&1 || echo "container not found"

            echo ""
            echo "════════════════════════════════════════"
            echo "  API-GATEWAY LOGS (last 30 lines)"
            echo "════════════════════════════════════════"
            docker logs quickbite-api-gateway --tail 30 2>&1 || echo "container not found"

            echo ""
            echo "════════════════════════════════════════"
            echo "  NGINX LOGS (last 20 lines)"
            echo "════════════════════════════════════════"
            docker logs quickbite-nginx --tail 20 2>&1 || echo "container not found"

            echo ""
            echo "════════════════════════════════════════"
            echo "  .env.docker KEYS (values hidden)"
            echo "════════════════════════════════════════"
            grep -o '^[^=]*' ~/quickbite/.env.docker | sort

            echo ""
            echo "════════════════════════════════════════"
            echo "  MONGODB_URI_AUTH (masked)"
            echo "════════════════════════════════════════"
            val=$(grep '^MONGODB_URI_AUTH=' ~/quickbite/.env.docker | cut -d= -f2-)
            echo "Length: ${#val} chars"
            echo "Starts with: ${val:0:35}..."
            echo "Ends with: ...${val: -20}"

            echo ""
            echo "════════════════════════════════════════"
            echo "  ALL MONGODB KEYS PRESENT"
            echo "════════════════════════════════════════"
            grep '^MONGODB_URI' ~/quickbite/.env.docker | grep -o '^[^=]*'

      - name: Hard restart auth-service and api-gateway
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/quickbite
            echo "Restarting auth-service and api-gateway..."
            docker compose -f docker-compose.prod.yml restart auth-service api-gateway
            sleep 10
            echo ""
            echo "── Post-restart status ──"
            docker compose -f docker-compose.prod.yml ps auth-service api-gateway
            echo ""
            echo "── Auth-service logs after restart ──"
            docker logs quickbite-auth-service --tail 30 2>&1
