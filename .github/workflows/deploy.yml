name: Deploy to AWS EC2

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # ─── 1. Type Check ─────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: cd packages/shared && npx tsc --noEmit

  # ─── 2. Build & Push Service Images ────────────────────────
  build-services:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: typecheck
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - restaurant-service
          - food-service
          - booking-service
          - order-service
          - payment-service
          - review-service
          - search-service
          - location-service
          - notification-service
          - admin-service
          - analytics-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercase image prefix
        id: vars
        run: echo "IMAGE_PREFIX=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/quickbite" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/service.Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.vars.outputs.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ steps.vars.outputs.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ─── 3. Deploy to EC2 ──────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build-services]
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image prefix
        id: vars
        run: echo "IMAGE_PREFIX=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/quickbite" >> $GITHUB_OUTPUT

      - name: Validate required secrets
        run: |
          missing=""
          [ -z "${{ secrets.MONGODB_URI }}" ]        && missing="$missing MONGODB_URI"
          [ -z "${{ secrets.REDIS_URL }}" ]           && missing="$missing REDIS_URL"
          [ -z "${{ secrets.JWT_ACCESS_SECRET }}" ]   && missing="$missing JWT_ACCESS_SECRET"
          [ -z "${{ secrets.JWT_REFRESH_SECRET }}" ]  && missing="$missing JWT_REFRESH_SECRET"
          [ -z "${{ secrets.RABBITMQ_PASSWORD }}" ]   && missing="$missing RABBITMQ_PASSWORD"
          [ -z "${{ secrets.DOMAIN }}" ]              && missing="$missing DOMAIN"
          [ -z "${{ secrets.EC2_HOST }}" ]            && missing="$missing EC2_HOST"
          [ -z "${{ secrets.EC2_USER }}" ]            && missing="$missing EC2_USER"
          [ -z "${{ secrets.EC2_SSH_KEY }}" ]         && missing="$missing EC2_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "❌ Missing required secrets:$missing"
            exit 1
          fi
          echo "✅ All required secrets present"

      - name: Write .env.docker from secrets
        run: |
          cat > .env.docker << 'ENVEOF'
          NODE_ENV=production
          AUTH_SERVICE_URL=http://auth-service:3001
          USER_SERVICE_URL=http://user-service:3002
          RESTAURANT_SERVICE_URL=http://restaurant-service:3003
          FOOD_SERVICE_URL=http://food-service:3004
          BOOKING_SERVICE_URL=http://booking-service:3005
          ORDER_SERVICE_URL=http://order-service:3006
          PAYMENT_SERVICE_URL=http://payment-service:3007
          REVIEW_SERVICE_URL=http://review-service:3008
          SEARCH_SERVICE_URL=http://search-service:3009
          LOCATION_SERVICE_URL=http://location-service:3010
          NOTIFICATION_SERVICE_URL=http://notification-service:3011
          ADMIN_SERVICE_URL=http://admin-service:3012
          ANALYTICS_SERVICE_URL=http://analytics-service:3013
          JWT_ACCESS_EXPIRES_IN=15m
          JWT_REFRESH_EXPIRES_IN=7d
          SMTP_HOST=smtp.gmail.com
          SMTP_PORT=587
          ENVEOF

          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> .env.docker
          echo "REDIS_URL=${{ secrets.REDIS_URL }}" >> .env.docker
          # Extract Redis connection parts for ioredis (needs host/port/password separately)
          REDIS_URL_VAL="${{ secrets.REDIS_URL }}"
          REDIS_PASS=$(echo "$REDIS_URL_VAL" | sed 's|redis://[^:]*:||' | cut -d@ -f1)
          REDIS_HOST=$(echo "$REDIS_URL_VAL" | cut -d@ -f2 | cut -d: -f1)
          REDIS_PORT=$(echo "$REDIS_URL_VAL" | cut -d@ -f2 | cut -d: -f2)
          echo "REDIS_PASSWORD=$REDIS_PASS" >> .env.docker
          echo "REDIS_HOST=$REDIS_HOST" >> .env.docker
          echo "REDIS_PORT=$REDIS_PORT" >> .env.docker
          echo "RABBITMQ_URL=amqp://quickbite:${{ secrets.RABBITMQ_PASSWORD }}@rabbitmq:5672" >> .env.docker

          # Per-service MongoDB URIs derived from the Atlas base URI
          # Safely strips the db name by splitting on the last '/' before any '?'
          # Works for both mongodb:// and mongodb+srv:// Atlas URIs
          BASE_URI="${{ secrets.MONGODB_URI }}"
          # Everything up to and including the last '/' before the db name
          URI_BASE=$(echo "$BASE_URI" | sed 's|/[^/?]*\(\?.*\)\?$||')
          # Query string (e.g. ?retryWrites=true&w=majority) — empty string if none
          URI_SUFFIX=$(echo "$BASE_URI" | grep -o '[?].*' || echo '')
          echo "MONGODB_URI_AUTH=${URI_BASE}/quickbite_auth${URI_SUFFIX}" >> .env.docker
          echo "MONGODB_URI_USER=${URI_BASE}/quickbite_user${URI_SUFFIX}" >> .env.docker
          echo "MONGODB_URI_RESTAURANT=${URI_BASE}/quickbite_restaurant${URI_SUFFIX}" >> .env.docker
          echo "MONGODB_URI_FOOD=${URI_BASE}/quickbite_food${URI_SUFFIX}" >> .env.docker
          echo "MONGODB_URI_BOOKING=${URI_BASE}/quickbite_booking${URI_SUFFIX}" >> .env.docker
          echo "MONGODB_URI_ORDER=${URI_BASE}/quickbite_order${URI_SUFFIX}" >> .env.docker
          echo "MONGODB_URI_PAYMENT=${URI_BASE}/quickbite_payment${URI_SUFFIX}" >> .env.docker
          echo "MONGODB_URI_REVIEW=${URI_BASE}/quickbite_review${URI_SUFFIX}" >> .env.docker
          echo "MONGODB_URI_SEARCH=${URI_BASE}/quickbite_search${URI_SUFFIX}" >> .env.docker
          echo "MONGODB_URI_NOTIFICATION=${URI_BASE}/quickbite_notification${URI_SUFFIX}" >> .env.docker
          echo "MONGODB_URI_ADMIN=${URI_BASE}/quickbite_admin${URI_SUFFIX}" >> .env.docker
          echo "MONGODB_URI_ANALYTICS=${URI_BASE}/quickbite_analytics${URI_SUFFIX}" >> .env.docker
          echo "MONGODB_URI_LOCATION=${URI_BASE}/quickbite_location${URI_SUFFIX}" >> .env.docker

          # Auth
          echo "JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}" >> .env.docker
          echo "JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}" >> .env.docker
          # CORS: allow all frontend origins (custom domain + www + vercel.app)
          echo "CORS_ORIGIN=https://qickbite.com,https://www.qickbite.com,https://qickbite.vercel.app" >> .env.docker
          echo "NEXT_PUBLIC_API_URL=https://${{ secrets.DOMAIN }}/api/v1" >> .env.docker

          # Firebase (required for push notifications / token verification)
          echo "FIREBASE_PRIVATE_KEY=${{ secrets.FIREBASE_PRIVATE_KEY }}" >> .env.docker

          # Payments
          echo "RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}" >> .env.docker
          echo "RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}" >> .env.docker
          echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> .env.docker
          echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> .env.docker
          echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> .env.docker
          echo "EMAIL_FROM=noreply@${{ secrets.DOMAIN }}" >> .env.docker

          # Firebase
          echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> .env.docker
          echo "FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}" >> .env.docker

          # Google
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env.docker
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env.docker
          echo "GOOGLE_CALLBACK_URL=https://${{ secrets.DOMAIN }}/api/v1/auth/google/callback" >> .env.docker
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> .env.docker

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,.env.docker,nginx/nginx.conf"
          target: "/home/${{ secrets.EC2_USER }}/quickbite"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/quickbite

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export IMAGE_PREFIX=${{ steps.vars.outputs.IMAGE_PREFIX }}
            export IMAGE_TAG=${{ github.sha }}
            export RABBITMQ_USER=quickbite
            export RABBITMQ_PASSWORD="${{ secrets.RABBITMQ_PASSWORD }}"
            export DOMAIN="${{ secrets.DOMAIN }}"

            # Pull new images first (while old containers still running — zero downtime)
            docker compose -f docker-compose.prod.yml pull

            # Force stop any stuck/zombie containers before graceful down
            docker compose -f docker-compose.prod.yml stop --timeout 30 2>/dev/null || true
            sleep 3

            # Remove stopped containers cleanly
            docker compose -f docker-compose.prod.yml rm -f 2>/dev/null || true
            sleep 3

            # Start fresh with new images
            docker compose -f docker-compose.prod.yml up -d

            # Wait for services to stabilize
            sleep 15

            # Show logs for any restarting containers
            echo "── Checking for crashed containers ──────"
            CRASHED=$(docker compose -f docker-compose.prod.yml ps --format json 2>/dev/null | \
              grep -o '"Name":"[^"]*","State":"restarting"' | \
              grep -o '"Name":"[^"]*"' | \
              sed 's/"Name":"//;s/"//' || true)
            if [ -n "$CRASHED" ]; then
              echo "⚠️  Crashed containers: $CRASHED"
              for name in $CRASHED; do
                echo "--- logs: $name ---"
                docker logs "$name" --tail 20 2>&1 || true
              done
            else
              echo "✅ All containers running"
            fi

            # Clean up old/dangling images to free disk space
            docker image prune -af --filter "until=24h"

            echo "✅ Deployed ${{ github.sha }} to https://${{ secrets.DOMAIN }}"

            # ── System health report ──────────────────────────────
            echo ""
            echo "════════════════════════════════════════"
            echo "        EC2 SYSTEM HEALTH REPORT"
            echo "════════════════════════════════════════"
            echo ""
            echo "── CPU & Memory ─────────────────────────"
            free -h
            echo ""
            echo "── Disk Usage ───────────────────────────"
            df -h /
            echo ""
            echo "── Docker Disk Usage ────────────────────"
            docker system df
            echo ""
            echo "── Running Containers (CPU/MEM) ─────────"
            docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}"
            echo ""
            echo "── Container Status ─────────────────────"
            docker compose -f docker-compose.prod.yml ps
            echo "════════════════════════════════════════"
