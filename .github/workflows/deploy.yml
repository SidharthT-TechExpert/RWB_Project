name: Deploy to AWS EC2

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/quickbite

jobs:
  # ─── 1. Type Check ─────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: cd packages/shared && npx tsc --noEmit

  # ─── 2. Build & Push Service Images ────────────────────────
  build-services:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: typecheck
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - restaurant-service
          - food-service
          - booking-service
          - order-service
          - payment-service
          - review-service
          - search-service
          - location-service
          - notification-service
          - admin-service
          - analytics-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/service.Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ─── 3. Build & Push Web App ───────────────────────────────
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    needs: typecheck
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:latest
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ─── 4. Deploy to EC2 ──────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build-services, build-web]
    steps:
      - uses: actions/checkout@v4

      - name: Write .env.docker from secrets
        run: |
          cat > .env.docker << 'ENVEOF'
          NODE_ENV=production
          AUTH_SERVICE_URL=http://auth-service:3001
          USER_SERVICE_URL=http://user-service:3002
          RESTAURANT_SERVICE_URL=http://restaurant-service:3003
          FOOD_SERVICE_URL=http://food-service:3004
          BOOKING_SERVICE_URL=http://booking-service:3005
          ORDER_SERVICE_URL=http://order-service:3006
          PAYMENT_SERVICE_URL=http://payment-service:3007
          REVIEW_SERVICE_URL=http://review-service:3008
          SEARCH_SERVICE_URL=http://search-service:3009
          LOCATION_SERVICE_URL=http://location-service:3010
          NOTIFICATION_SERVICE_URL=http://notification-service:3011
          ADMIN_SERVICE_URL=http://admin-service:3012
          ANALYTICS_SERVICE_URL=http://analytics-service:3013
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_URL=redis://redis:6379
          ENVEOF

          # Append secrets separately to avoid heredoc issues
          echo "RABBITMQ_URL=amqp://quickbite:${{ secrets.RABBITMQ_PASSWORD }}@rabbitmq:5672" >> .env.docker
          echo "JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}" >> .env.docker
          echo "JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}" >> .env.docker
          echo "JWT_ACCESS_EXPIRES_IN=15m" >> .env.docker
          echo "JWT_REFRESH_EXPIRES_IN=7d" >> .env.docker
          echo "CORS_ORIGIN=https://${{ secrets.DOMAIN }}" >> .env.docker
          echo "NEXT_PUBLIC_API_URL=https://${{ secrets.DOMAIN }}/api/v1" >> .env.docker
          echo "RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}" >> .env.docker
          echo "RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}" >> .env.docker
          echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> .env.docker
          echo "SMTP_HOST=smtp.gmail.com" >> .env.docker
          echo "SMTP_PORT=587" >> .env.docker
          echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> .env.docker
          echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> .env.docker
          echo "EMAIL_FROM=noreply@${{ secrets.DOMAIN }}" >> .env.docker
          echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> .env.docker
          echo "FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}" >> .env.docker
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env.docker
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env.docker
          echo "GOOGLE_CALLBACK_URL=https://${{ secrets.DOMAIN }}/api/v1/auth/google/callback" >> .env.docker
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> .env.docker

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,.env.docker,nginx/nginx.conf"
          target: "/home/${{ secrets.EC2_USER }}/quickbite"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/quickbite

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}
            export IMAGE_TAG=${{ github.sha }}
            export MONGO_USER=quickbite
            export MONGO_PASSWORD="${{ secrets.MONGO_PASSWORD }}"
            export RABBITMQ_USER=quickbite
            export RABBITMQ_PASSWORD="${{ secrets.RABBITMQ_PASSWORD }}"
            export DOMAIN="${{ secrets.DOMAIN }}"

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

            echo "✅ Deployed ${{ github.sha }} to https://${{ secrets.DOMAIN }}"
