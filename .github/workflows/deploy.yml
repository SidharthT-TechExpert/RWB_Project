name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger (e.g. secret update)'
        required: false
        default: 'manual trigger'

env:
  REGISTRY: ghcr.io

jobs:
  # ─── 1. Type Check ────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm install --omit=optional
        working-directory: server
      - run: npx tsc --noEmit
        working-directory: server

  # ─── 2. Build & Push Docker Images (API + Web) ────────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: typecheck
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.vars.outputs.API_IMAGE }}
      web_image: ${{ steps.vars.outputs.WEB_IMAGE }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        id: vars
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "API_IMAGE=ghcr.io/${OWNER}/quickbite-api" >> $GITHUB_OUTPUT
          echo "WEB_IMAGE=ghcr.io/${OWNER}/quickbite-web" >> $GITHUB_OUTPUT

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.API_IMAGE }}:latest
            ${{ steps.vars.outputs.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.WEB_IMAGE }}:latest
            ${{ steps.vars.outputs.WEB_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ secrets.DOMAIN }}/api/v1
            NEXT_PUBLIC_GOOGLE_MAPS_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_KEY }}
            NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ─── 3. Deploy to EC2 ─────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set image prefix
        id: vars
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=ghcr.io/${OWNER}/quickbite" >> $GITHUB_OUTPUT

      - name: Validate required secrets
        run: |
          missing=""
          [ -z "${{ secrets.EC2_HOST }}" ]               && missing="$missing EC2_HOST"
          [ -z "${{ secrets.EC2_USER }}" ]               && missing="$missing EC2_USER"
          [ -z "${{ secrets.EC2_SSH_KEY }}" ]            && missing="$missing EC2_SSH_KEY"
          [ -z "${{ secrets.DOMAIN }}" ]                 && missing="$missing DOMAIN"

          # Must have EITHER Infisical creds OR direct secrets
          has_infisical=true
          [ -z "${{ secrets.INFISICAL_CLIENT_ID }}" ]     && has_infisical=false
          [ -z "${{ secrets.INFISICAL_CLIENT_SECRET }}" ] && has_infisical=false
          [ -z "${{ secrets.INFISICAL_PROJECT_ID }}" ]    && has_infisical=false

          if [ "$has_infisical" = "false" ]; then
            # Fall back to checking direct secrets
            [ -z "${{ secrets.MONGODB_URI }}" ]        && missing="$missing MONGODB_URI"
            [ -z "${{ secrets.JWT_ACCESS_SECRET }}" ]  && missing="$missing JWT_ACCESS_SECRET"
            [ -z "${{ secrets.JWT_REFRESH_SECRET }}" ] && missing="$missing JWT_REFRESH_SECRET"
            echo "⚠️  Infisical not configured — using direct secrets"
          else
            echo "✅ Infisical configured — secrets will be fetched at runtime"
          fi

          if [ -n "$missing" ]; then
            echo "❌ Missing required secrets:$missing"
            exit 1
          fi
          echo "✅ All required secrets present"

      - name: Write .env.docker
        run: |
          cat > .env.docker << 'EOF'
          NODE_ENV=production
          PORT=3000
          CORS_ORIGIN=https://qickbite.com,https://www.qickbite.com
          FRONTEND_URL=https://qickbite.com
          JWT_ACCESS_EXPIRES_IN=15m
          JWT_REFRESH_EXPIRES_IN=7d
          SMTP_HOST=smtp.gmail.com
          SMTP_PORT=587
          EOF

          # ── Infisical (preferred — secrets loaded at runtime) ──
          echo "INFISICAL_CLIENT_ID=${{ secrets.INFISICAL_CLIENT_ID }}" >> .env.docker
          echo "INFISICAL_CLIENT_SECRET=${{ secrets.INFISICAL_CLIENT_SECRET }}" >> .env.docker
          echo "INFISICAL_PROJECT_ID=${{ secrets.INFISICAL_PROJECT_ID }}" >> .env.docker
          echo "INFISICAL_ENV=prod" >> .env.docker

          # ── Direct secrets (fallback if Infisical not used) ────
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> .env.docker
          echo "REDIS_URL=${{ secrets.REDIS_URL }}" >> .env.docker
          echo "JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}" >> .env.docker
          echo "JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}" >> .env.docker
          echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> .env.docker
          echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> .env.docker
          echo "EMAIL_FROM=noreply@${{ secrets.DOMAIN }}" >> .env.docker
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env.docker
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env.docker
          echo "GOOGLE_CALLBACK_URL=https://${{ secrets.DOMAIN }}/api/v1/auth/google/callback" >> .env.docker
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> .env.docker
          echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> .env.docker
          echo "FIREBASE_PRIVATE_KEY=${{ secrets.FIREBASE_PRIVATE_KEY }}" >> .env.docker
          echo "FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}" >> .env.docker
          echo "RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}" >> .env.docker
          echo "RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}" >> .env.docker
          echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> .env.docker
          echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}" >> .env.docker
          echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> .env.docker
          echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}" >> .env.docker
          echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}" >> .env.docker
          echo "NEXT_PUBLIC_API_URL=https://${{ secrets.DOMAIN }}/api/v1" >> .env.docker

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          echo "✅ SSH key written and host fingerprint stored"

      - name: Copy files to EC2
        run: |
          SSH_DEST="${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"
          REMOTE_DIR="/home/${{ secrets.EC2_USER }}/quickbite"
          ssh $SSH_DEST "mkdir -p ${REMOTE_DIR}/nginx"
          scp docker-compose.prod.yml .env.docker ${SSH_DEST}:${REMOTE_DIR}/
          scp nginx/nginx.conf ${SSH_DEST}:${REMOTE_DIR}/nginx/
          echo "✅ Files copied to EC2"

      - name: Deploy on EC2
        run: |
          SSH_DEST="${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"
          IMAGE_PREFIX="${{ steps.vars.outputs.IMAGE_PREFIX }}"
          IMAGE_TAG="${{ github.sha }}"
          ACTOR="${{ github.actor }}"
          GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          DOMAIN="${{ secrets.DOMAIN }}"

          ssh $SSH_DEST bash -s << ENDSSH
            set -e
            cd ~/quickbite

            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u ${ACTOR} --password-stdin

            export IMAGE_PREFIX=${IMAGE_PREFIX}
            export IMAGE_TAG=${IMAGE_TAG}

            # Pull new images while old containers still running
            docker compose -f docker-compose.prod.yml pull

            # Graceful restart
            docker compose -f docker-compose.prod.yml stop --timeout 30 2>/dev/null || true
            sleep 3
            docker compose -f docker-compose.prod.yml rm -f 2>/dev/null || true
            sleep 2
            docker compose -f docker-compose.prod.yml up -d

            # Wait for startup
            echo "Waiting for stack to start..."
            sleep 25

            # Health check
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
                echo "✅ API health check passed"
                break
              fi
              echo "⏳ Waiting... attempt \$i/5"
              sleep 5
            done

            docker compose -f docker-compose.prod.yml ps
            docker image prune -af --filter "until=24h"

            echo "✅ Deployed ${IMAGE_TAG} (web + api) to https://${DOMAIN}"
            echo ""
            echo "════════════════ HEALTH REPORT ══════════════════"
            free -h
            df -h /
            docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}"
            echo "════════════════════════════════════════════════"
          ENDSSH
