# DO NOT commit real secrets — use a secrets manager (AWS Secrets Manager, Vault, etc.)
# This is a template showing the required secret keys
apiVersion: v1
kind: Secret
metadata:
  name: quickbite-secrets
  namespace: quickbite
type: Opaque
stringData:
  JWT_ACCESS_SECRET: "REPLACE_WITH_REAL_SECRET"
  JWT_REFRESH_SECRET: "REPLACE_WITH_REAL_SECRET"
  MONGODB_URI_AUTH: "REPLACE_WITH_MONGODB_URI"
  REDIS_HOST: "REPLACE_WITH_REDIS_HOST"
  REDIS_PASSWORD: "REPLACE_WITH_REDIS_PASSWORD"
  RABBITMQ_URL: "REPLACE_WITH_RABBITMQ_URL"
  RAZORPAY_KEY_ID: "REPLACE_WITH_KEY"
  RAZORPAY_KEY_SECRET: "REPLACE_WITH_SECRET"
  STRIPE_SECRET_KEY: "REPLACE_WITH_KEY"
  SMTP_HOST: "REPLACE_WITH_SMTP_HOST"
  SMTP_USER: "REPLACE_WITH_SMTP_USER"
  SMTP_PASS: "REPLACE_WITH_SMTP_PASS"
  GOOGLE_MAPS_API_KEY: "REPLACE_WITH_KEY"
