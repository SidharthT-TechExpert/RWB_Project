## QuickBite Microservices — Kubernetes Deployments & Services
## Apply: kubectl apply -f k8s/ -n quickbite

---
# Auth Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: quickbite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: quickbite/auth-service:latest
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: quickbite-secrets
          env:
            - name: AUTH_SERVICE_PORT
              value: "3001"
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits:  { memory: "512Mi", cpu: "500m" }
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: quickbite
spec:
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
