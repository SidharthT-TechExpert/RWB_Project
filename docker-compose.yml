services:
  # ─── Infrastructure ───────────────────────────────────────────
  mongodb:
    image: mongo:8.0
    container_name: quickbite-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - quickbite-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    container_name: quickbite-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - quickbite-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: quickbite-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: quickbite
      RABBITMQ_DEFAULT_PASS: quickbite_secret
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - quickbite-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Microservices ────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: api-gateway
    container_name: quickbite-api-gateway
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: .env.docker
    environment:
      SERVICE_NAME: api-gateway
      API_GATEWAY_PORT: 3000
    networks:
      - quickbite-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  auth-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: auth-service
    container_name: quickbite-auth-service
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file: .env.docker
    environment:
      SERVICE_NAME: auth-service
      AUTH_SERVICE_PORT: 3001
      MONGODB_URI_AUTH: mongodb://mongodb:27017/quickbite_auth
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - quickbite-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  user-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: user-service
    container_name: quickbite-user-service
    restart: unless-stopped
    ports:
      - '3002:3002'
    env_file: .env.docker
    environment:
      SERVICE_NAME: user-service
      USER_SERVICE_PORT: 3002
      MONGODB_URI_USER: mongodb://mongodb:27017/quickbite_user
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - quickbite-network

  restaurant-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: restaurant-service
    container_name: quickbite-restaurant-service
    restart: unless-stopped
    ports:
      - '3003:3003'
    env_file: .env.docker
    environment:
      SERVICE_NAME: restaurant-service
      RESTAURANT_SERVICE_PORT: 3003
      MONGODB_URI_RESTAURANT: mongodb://mongodb:27017/quickbite_restaurant
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - quickbite-network

  food-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: food-service
    container_name: quickbite-food-service
    restart: unless-stopped
    ports:
      - '3004:3004'
    env_file: .env.docker
    environment:
      SERVICE_NAME: food-service
      FOOD_SERVICE_PORT: 3004
      MONGODB_URI_FOOD: mongodb://mongodb:27017/quickbite_food
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - quickbite-network

  booking-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: booking-service
    container_name: quickbite-booking-service
    restart: unless-stopped
    ports:
      - '3005:3005'
    env_file: .env.docker
    environment:
      SERVICE_NAME: booking-service
      BOOKING_SERVICE_PORT: 3005
      MONGODB_URI_BOOKING: mongodb://mongodb:27017/quickbite_booking
      RABBITMQ_URL: amqp://quickbite:quickbite_secret@rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - quickbite-network

  order-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: order-service
    container_name: quickbite-order-service
    restart: unless-stopped
    ports:
      - '3006:3006'
    env_file: .env.docker
    environment:
      SERVICE_NAME: order-service
      ORDER_SERVICE_PORT: 3006
      MONGODB_URI_ORDER: mongodb://mongodb:27017/quickbite_order
      RABBITMQ_URL: amqp://quickbite:quickbite_secret@rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - quickbite-network

  payment-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: payment-service
    container_name: quickbite-payment-service
    restart: unless-stopped
    ports:
      - '3007:3007'
    env_file: .env.docker
    environment:
      SERVICE_NAME: payment-service
      PAYMENT_SERVICE_PORT: 3007
      MONGODB_URI_PAYMENT: mongodb://mongodb:27017/quickbite_payment
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - quickbite-network

  review-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: review-service
    container_name: quickbite-review-service
    restart: unless-stopped
    ports:
      - '3008:3008'
    env_file: .env.docker
    environment:
      SERVICE_NAME: review-service
      REVIEW_SERVICE_PORT: 3008
      MONGODB_URI_REVIEW: mongodb://mongodb:27017/quickbite_review
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - quickbite-network

  search-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: search-service
    container_name: quickbite-search-service
    restart: unless-stopped
    ports:
      - '3009:3009'
    env_file: .env.docker
    environment:
      SERVICE_NAME: search-service
      SEARCH_SERVICE_PORT: 3009
      MONGODB_URI_SEARCH: mongodb://mongodb:27017/quickbite_search
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - quickbite-network

  location-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: location-service
    container_name: quickbite-location-service
    restart: unless-stopped
    ports:
      - '3010:3010'
    env_file: .env.docker
    environment:
      SERVICE_NAME: location-service
      LOCATION_SERVICE_PORT: 3010
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - quickbite-network

  notification-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: notification-service
    container_name: quickbite-notification-service
    restart: unless-stopped
    ports:
      - '3011:3011'
    env_file: .env.docker
    environment:
      SERVICE_NAME: notification-service
      NOTIFICATION_SERVICE_PORT: 3011
      MONGODB_URI_NOTIFICATION: mongodb://mongodb:27017/quickbite_notification
      RABBITMQ_URL: amqp://quickbite:quickbite_secret@rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - quickbite-network

  admin-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: admin-service
    container_name: quickbite-admin-service
    restart: unless-stopped
    ports:
      - '3012:3012'
    env_file: .env.docker
    environment:
      SERVICE_NAME: admin-service
      ADMIN_SERVICE_PORT: 3012
      MONGODB_URI_ADMIN: mongodb://mongodb:27017/quickbite_admin
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - quickbite-network

  analytics-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: analytics-service
    container_name: quickbite-analytics-service
    restart: unless-stopped
    ports:
      - '3013:3013'
    env_file: .env.docker
    environment:
      SERVICE_NAME: analytics-service
      ANALYTICS_SERVICE_PORT: 3013
      MONGODB_URI_ANALYTICS: mongodb://mongodb:27017/quickbite_analytics
      RABBITMQ_URL: amqp://quickbite:quickbite_secret@rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - quickbite-network

volumes:
  mongodb_data:
  redis_data:
  rabbitmq_data:

networks:
  quickbite-network:
    driver: bridge
