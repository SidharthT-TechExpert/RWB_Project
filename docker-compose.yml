services:
  # ─── Infrastructure ───────────────────────────────────────────
  mongodb:
    image: mongo:8.0
    container_name: quickbite-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - quickbite-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    container_name: quickbite-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - quickbite-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── API (monolith) ───────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: quickbite-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: .env.docker
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/quickbite
      REDIS_URL: redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - quickbite-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongodb_data:
  redis_data:

networks:
  quickbite-network:
    driver: bridge
