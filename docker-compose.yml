services:
  # MongoDB is already running natively on port 27017 — no container needed

  redis:
    image: redis:7.2-alpine
    container_name: quickbite-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - quickbite-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: quickbite-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: quickbite
      RABBITMQ_DEFAULT_PASS: quickbite_secret
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - quickbite-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  rabbitmq_data:

networks:
  quickbite-network:
    driver: bridge
